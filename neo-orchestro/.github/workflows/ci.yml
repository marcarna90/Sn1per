# Neo-Orchestro CI. Self-contained: lives with the project so it works as soon as the
# directory is extracted to its own repository (ADR 0001).
# Pin actions by commit SHA in the real repository; Dependabot (dependabot.yml) keeps them current.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neo
          POSTGRES_PASSWORD: neo_ci_only
          POSTGRES_DB: neo_orchestro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neo -d neo_orchestro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # An unreachable service must FAIL the build, not skip the tests.
      NEO_REQUIRE_SERVICES: "1"
      NEO_TEST_DATABASE_URL: postgresql+pg8000://neo:neo_ci_only@localhost:5432/neo_orchestro_test
      NEO_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Known vulnerabilities (runtime lock)
        run: pip-audit -r requirements.txt --require-hashes --progress-spinner off
      - name: Lock file matches pyproject.toml
        if: matrix.python == '3.13'
        # Re-compiles in place: existing pins are kept (no surprise upgrades), so a diff means
        # pyproject.toml changed without `make lock`.
        run: |
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras -o requirements.txt pyproject.toml
          git diff --exit-code requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Known vulnerabilities (runtime dependencies)
        run: npm audit --omit=dev

  images:
    name: Docker images and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - name: Dockerfile lint (web)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
      - name: Compose file is valid
        run: |
          printf 'NEO_SECRET_KEY=%s\nPOSTGRES_PASSWORD=ci\nREDIS_PASSWORD=ci\n' "$(openssl rand -hex 32)" > .env
          docker compose config --quiet
      - name: Build images (no push)
        run: docker compose build
      - name: Backend image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id neo-orchestro-backend:local -u)
          test "$uid" = "10001"
      - name: No pip in the backend image
        run: "! docker run --rm --entrypoint python neo-orchestro-backend:local -m pip --version"
      # Found by the first real image run: the worker crashed at start-up (missing dependency in the
      # runtime lock) and nginx kept a stale API address after the API was recreated.
      - name: Stack starts and every service becomes healthy (production mode)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Readiness through nginx (database + Redis)
        run: curl -fsS http://127.0.0.1:8080/health/ready
      - name: nginx follows the API after it is recreated (no stale upstream address)
        run: |
          docker compose up -d --force-recreate --no-deps --wait api
          curl -fsS http://127.0.0.1:8080/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for obvious credentials
        run: |
          ! git grep -nIE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN (RSA|OPENSSH|EC|PGP)? ?PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':!docs/adr'
          test -z "$(git ls-files | grep -E '(^|/)\.env$')"
