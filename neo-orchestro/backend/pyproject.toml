[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-orchestro"
version = "0.1.0"
description = "Neo-Orchestro — Automated Security Assessment & Orchestration Platform. Designed & Developed by Ronald TSR."
requires-python = ">=3.12"
authors = [{ name = "Ronald TSR" }]
# Licence intentionally unset until the owner chooses one (see ADR 0001).
dependencies = [
  # Justifications and licences: docs/licences.md, ADR 0010.
  "fastapi>=0.162.5,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.1,<2.2",
  "pg8000>=1.31,<2",
  "alembic>=1.20,<2",
  "celery>=5.7,<6",
  "redis>=8,<9",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.15,<3",
  "dnspython>=2.9,<3",
  "structlog>=26,<27",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "pip-tools>=7.5,<8",
  "pip-audit>=2.9,<3",
]

[project.scripts]
neo-orchestro = "neo_orchestro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF",
  "S",    # bandit: security
  "T20",  # no print
  "PL",   # pylint subset
  "TID",  # tidy imports
  "ASYNC",
]
ignore = [
  "PLR0913",  # many-argument functions are normal for DI-style services
  "PLR2004",  # magic values in tests/threat tables
  "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR0915"]
"src/neo_orchestro/cli.py" = ["T20"]
"migrations/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["neo_orchestro"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["neo_orchestro"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pg8000.*", "argon2.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
markers = [
  "unit: pure tests, no external services",
  "integration: needs real PostgreSQL (and Redis for some)",
  "security: threat-table driven security tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["neo_orchestro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
